<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#15151c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ポケットリグ</title>
<style>
:root{
  --bg:#101016; --panel:#1b1b24; --panel2:#24242f; --line:#30303d;
  --text:#ececf3; --muted:#9a9ab0; --accent:#ff7aa8; --accent2:#ffb3cc; --danger:#ff6b6b;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  min-height:40px;padding:0 12px;touch-action:manipulation;cursor:pointer}
button:active{transform:scale(.97)}
button:disabled{opacity:.35}
button.on{background:var(--accent);border-color:var(--accent);color:#2a0f1a;font-weight:700}
input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;width:100%;-webkit-user-select:text;user-select:text}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent);height:32px}
.hidden{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}

#app{display:flex;flex-direction:column;height:100dvh;height:100vh;height:100dvh}
header.top{display:flex;align-items:center;gap:8px;padding:calc(6px + var(--safe-t)) 10px 6px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{flex:1;min-width:0}
.brand b{font-size:16px;letter-spacing:.04em}
.brand b span{color:var(--accent)}
.brand small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .icon{width:40px;padding:0}

main.work{flex:1;display:flex;flex-direction:column;min-height:0}
#stage{flex:1;position:relative;min-height:0;overflow:hidden;
  background:radial-gradient(circle at 50% 40%,#1c1c27,#0c0c11)}
#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#empty h1{margin:0 0 4px;font-size:22px}
#empty h1 span{color:var(--accent)}
#empty p{margin:0 0 8px;color:var(--muted);font-size:13px;line-height:1.7}
#empty button{width:min(280px,80vw);min-height:48px}
#empty .primary{background:var(--accent);border-color:var(--accent);color:#2a0f1a;font-weight:700}
#modePill{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(20,20,28,.85);
  border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12px;color:var(--muted);pointer-events:none;white-space:nowrap}

.sheet{background:var(--panel);border-top:1px solid var(--line);height:42vh;height:42dvh;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;min-height:36px}
.tabs .close{flex:0 0 40px;padding:0}
.pane{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}

#partList{list-style:none;margin:0;padding:4px 0}
#partList li.grp{padding:8px 12px 2px;font-size:11px;color:var(--muted)}
#partList li.p{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 6px;margin:2px 6px;border-radius:10px;cursor:pointer}
#partList li.p.sel{background:#3a2430;outline:1px solid var(--accent)}
#partList li.p.off .nm{opacity:.45}
#partList .vis{width:36px;min-height:36px;padding:0;background:none;border:0}
#partList img{width:40px;height:40px;border-radius:6px;background:repeating-conic-gradient(#3a3a46 0 25%,#2c2c36 0 50%) 0 0/10px 10px;flex:0 0 40px;object-fit:contain}
#partList .bound::after{content:"●";color:var(--accent);font-size:9px;margin-left:6px;vertical-align:middle}
#partList .nm{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#propsPane{padding:10px 12px 16px}
.pempty{color:var(--muted);font-size:13px;padding:20px 0;text-align:center}
.f{display:block;margin-bottom:10px;font-size:12px;color:var(--muted)}
.f .v{float:right;color:var(--text)}
.row2{display:flex;gap:10px}
.row2 .f{flex:1}
.pgroup{font-size:11px;color:var(--muted);margin:-4px 0 10px}
.btnrow{display:flex;gap:8px;margin-top:8px}
.btnrow button{flex:1}
button.danger{color:var(--danger)}
.tabs button{padding:0 2px;font-size:13px;white-space:nowrap;min-width:0}
.pad{padding:4px 10px 14px}
.pad2{margin:14px 10px 4px;display:flex;align-items:center;justify-content:space-between}
button.sm{min-height:32px;padding:0 10px;font-size:12px}
select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;width:100%}
.prm .f{margin:8px 0 0}
.chk{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:8px}
.chk input{width:auto}
.mo-bar{display:flex;gap:6px;padding:10px 10px 4px;align-items:center}
.mo-bar select{flex:1}
.mo-time{display:flex;align-items:center;gap:8px;padding:6px 12px 0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mo-time input{flex:1}
.mo-ctl{padding:0 10px}
.mo-ctl button{font-size:13px;padding:0 6px}
#moRec.on{background:#e04848;border-color:#e04848;color:#fff}
.mrow{margin:8px 8px 0;padding:8px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.mrow.touch{border-color:#e04848}
.mrow-h{display:flex;justify-content:space-between;font-size:13px}
.mrow-h span{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.mrow-h em{font-style:normal;color:var(--accent2);font-size:11px;margin-left:6px}
.mrow input{display:block}
.lane{display:block;width:100%;height:16px;margin-top:2px}
button.auto{background:linear-gradient(135deg,#ff7aa8,#b98cff);border:0;color:#24101c;font-weight:700}
#split{position:fixed;inset:0;z-index:22;background:var(--bg);display:flex;flex-direction:column}
.sp-top{display:flex;align-items:center;gap:8px;padding:calc(6px + var(--safe-t)) 10px 6px;background:var(--panel);border-bottom:1px solid var(--line)}
.sp-top .icon{width:40px;padding:0}
.sp-title{flex:1;min-width:0}
.sp-title b{display:block;font-size:16px}
.sp-title small{color:var(--muted);font-size:11px}
.sp-stage{flex:1;position:relative;min-height:0;background:#0c0c11}
#spCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.sp-hint{position:absolute;left:10px;right:60px;top:10px;background:rgba(20,20,28,.88);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;line-height:1.6;pointer-events:none}
.sp-fit{position:absolute;right:10px;top:10px;min-height:36px;padding:0 10px;font-size:12px}
.sp-panel{background:var(--panel);border-top:1px solid var(--line);padding:8px 10px calc(10px + var(--safe-b))}
.sp-steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.sp-steps button{flex:0 0 auto;min-height:32px;padding:0 10px;font-size:12px;border-radius:99px}
.sp-steps button.done{color:var(--accent2)}
.sp-size{display:flex;align-items:center;gap:10px;margin:8px 0 0}
.sp-size input{flex:1}
.sp-opts{display:flex;flex-wrap:wrap;gap:4px 14px;margin:2px 0 4px}
.sp-opts .chk{margin-top:4px}
.sp-aibar{display:flex;gap:6px;align-items:center;margin-top:8px}
.sp-aibar .seg{flex:1}
.sp-aibar>button{min-height:38px;padding:0 10px;font-size:12px}
#split .seg button[data-tool=ai].on,#split .seg button[data-tool=ai]{font-weight:700}
.cutbtn{background:var(--accent);border-color:var(--accent);color:#2a0f1a;font-weight:700}
.rigbar{padding:10px 10px 2px}
.rigbar button{width:100%;min-height:44px;font-size:14px}
.chk.big{display:block;position:relative;padding:10px 10px 10px 40px;margin:0 0 6px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;font-size:14px;color:var(--text)}
.chk.big input{position:absolute;left:12px;top:12px;width:18px;height:18px;accent-color:var(--accent)}
.chk.big small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.chk.big em{font-style:normal;font-size:11px;color:var(--accent2);margin-left:8px}
.cats{margin:10px 0 4px;font-size:13px}
.cats summary{padding:10px 4px;color:var(--accent2);cursor:pointer}
.catrow{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.catrow span{flex:1;min-width:0;color:var(--text);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catrow select{flex:0 0 52%}
.auto-note{font-size:12px;color:var(--muted);margin:0 2px 10px;line-height:1.6}
.primary-btn{width:100%;min-height:46px;margin-top:6px;background:var(--accent);border-color:var(--accent);color:#2a0f1a;font-weight:700}
.prm{margin:8px 8px 0;padding:10px 10px 6px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.prm.armed{border-color:var(--accent);background:#2e2129}
.prm-h{display:flex;align-items:center;gap:6px}
.prm-h .pname{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;min-height:32px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prm-h .pval{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.prm-h button.sm{min-height:32px;padding:0 10px;font-size:12px}
.prm-s{position:relative;padding-top:6px}
.prm-s input{display:block}
.ticks{position:relative;height:10px;margin:0 8px}
.ticks i{position:absolute;top:0;width:2px;height:8px;margin-left:-1px;background:var(--muted);border-radius:1px}
.ticks i.def{background:var(--text)}
.ticks i.cur{background:var(--accent);height:10px}
.prm-k{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 0 4px;font-size:12px;color:var(--muted)}
.prm-k button{min-height:30px;padding:0 10px;font-size:12px}
.prm-empty{padding:18px 16px 6px;color:var(--muted);font-size:13px;line-height:1.7}
.target{font-size:12px;padding:8px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line);margin-bottom:10px;color:var(--muted)}
.target.key{border-color:var(--accent);color:var(--accent2)}
#modePill.key{border-color:var(--accent);color:var(--accent2)}
#actSheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;display:flex;align-items:flex-end;justify-content:center}
.as-box{width:min(480px,100%);background:var(--panel);border-radius:18px 18px 0 0;padding:12px 12px calc(12px + var(--safe-b));max-height:80vh;overflow-y:auto}
.as-title{font-size:13px;color:var(--muted);text-align:center;padding:4px 0 10px}
#asBody button{display:block;width:100%;margin-bottom:6px;min-height:46px;text-align:left}
#asBody small{display:block;color:var(--muted);font-size:11px}
.as-cancel{width:100%;min-height:46px;margin-top:4px;background:var(--bg)}
.sect{margin:18px 0 10px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;font-weight:700}
.sect span{font-weight:400;color:var(--muted);font-size:11px;margin-left:8px}
#deformBar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;align-items:center;
  background:rgba(27,27,36,.92);border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 12px}
#deformBar label{flex:1;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}
#deformBar input{flex:1}
#deformBar button{min-height:36px;padding:0 10px;font-size:13px}

nav.bottom{display:flex;gap:8px;align-items:center;padding:8px 10px calc(8px + var(--safe-b));background:var(--panel);border-top:1px solid var(--line)}
.seg{display:flex;flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;min-height:38px;background:none}
.seg button.on{background:var(--accent)}
nav.bottom > button{min-width:52px;padding:0 10px}

.menu{position:fixed;right:10px;top:calc(56px + var(--safe-t));background:var(--panel2);border:1px solid var(--line);
  border-radius:14px;padding:6px;min-width:220px;z-index:20;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.menu button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;text-align:left;min-height:44px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
#loading{position:fixed;inset:0;background:rgba(8,8,12,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:30}
.spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;top:calc(100px + var(--safe-t));transform:translateX(-50%) translateY(-12px);background:#2d2d3a;border:1px solid var(--line);
  padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:40;max-width:90vw;text-align:center;line-height:1.5;white-space:pre-line}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:900px){
  main.work{flex-direction:row}
  .sheet{height:auto;width:340px;border-top:0;border-left:1px solid var(--line)}
  .sheet.hidden{display:flex!important}
  .tabs .close,#sheetBtn{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><b>ポケット<span>リグ</span></b><small id="docName">ステップ4：揺れとモーション</small></div>
    <button id="undoBtn" class="icon" aria-label="元に戻す" disabled><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg></button>
    <button id="redoBtn" class="icon" aria-label="やり直す" disabled><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg></button>
    <button id="menuBtn" class="icon" aria-label="メニュー"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
  </header>

  <main class="work">
    <div id="stage">
      <canvas id="gl"></canvas>
      <div id="modePill" class="hidden"></div>
      <div id="deformBar" class="hidden">
        <label>ブラシ<input id="brushR" type="range" min="12" max="200" step="1" value="60"></label>
        <button id="dbMesh">網</button>
        <button id="dbReset">戻す</button>
      </div>
      <div id="empty">
        <h1>ポケット<span>リグ</span></h1>
        <p>パーツ分けしたPSDを読み込んで<br>スマホで動くキャラクターを作ろう</p>
        <button class="primary" data-act="open">PSD・画像を開く</button>
        <button data-act="sample">サンプルで試す</button>
        <p style="margin-top:6px">パーツ分けしていない1枚絵も開けます。<br>開いたあと、案内に沿ってなぞるだけでパーツに分けられます</p>
      </div>
    </div>
    <aside id="sheet" class="sheet hidden">
      <div class="tabs">
        <button data-tab="parts" class="on">パーツ</button>
        <button data-tab="props">調整</button>
        <button data-tab="params">パラメータ</button>
        <button data-tab="motion">動き</button>
        <button class="close" id="sheetClose" aria-label="閉じる"><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
      <div id="partsPane" class="pane"><ul id="partList"></ul></div>
      <div id="paramsPane" class="pane hidden">
        <div class="rigbar"><button id="autoRig" class="auto">✨ パラメータをおまかせで作る</button></div>
        <div id="paramList"></div>
        <div class="btnrow pad"><button id="addParam">＋ 追加</button><button id="playParams">▶ 動かす</button><button id="resetParams">初期値に</button></div>
        <div class="sect pad2">揺れ（物理演算）<button id="physOn" class="sm on">ON</button></div>
        <div id="physList"></div>
        <div class="btnrow pad"><button id="addPhys">＋ 揺れを追加</button></div>
      </div>
      <div id="motionPane" class="pane hidden">
        <div class="mo-bar"><select id="moSel"></select><button id="moAuto" class="sm auto">✨ おまかせ</button><button id="moNew" class="sm">＋ 新規</button><button id="moMore" class="sm" aria-label="モーションの設定">⋯</button></div>
        <div id="moBody" class="hidden">
          <div class="mo-time"><span id="moT">0.00</span><input type="range" id="moScrub" min="0" max="3" step="0.01" value="0"><span id="moDur">3.0秒</span></div>
          <div class="btnrow mo-ctl"><button id="moPlay">▶ 再生</button><button id="moRec">● 記録</button><button id="moKey">◆ キー</button><button id="moDelKey" aria-label="この時間のキーを削除">✕</button></div>
          <div id="moRows"></div>
        </div>
        <div id="moEmpty" class="prm-empty"></div>
      </div>
      <div id="propsPane" class="pane hidden">
        <div class="pempty" id="pEmpty">パーツをタップして選択してください</div>
        <div id="pBody" class="hidden">
          <div class="target" id="pTarget"></div>
          <label class="f">名前<input id="pName" autocomplete="off"></label>
          <div class="pgroup" id="pGroup"></div>
          <div class="row2">
            <label class="f">X<input id="pX" type="number" step="1" inputmode="decimal"></label>
            <label class="f">Y<input id="pY" type="number" step="1" inputmode="decimal"></label>
          </div>
          <label class="f">回転<span class="v" id="pRotV"></span><input id="pRot" type="range" min="-180" max="180" step="1"></label>
          <label class="f">拡大<span class="v" id="pScaleV"></span><input id="pScale" type="range" min="0.1" max="3" step="0.01"></label>
          <label class="f">不透明度<span class="v" id="pOpV"></span><input id="pOp" type="range" min="0" max="1" step="0.01"></label>
          <div class="btnrow"><button id="pVis">非表示にする</button><button id="pUp">前へ</button><button id="pDown">後ろへ</button></div>
          <div class="btnrow"><button id="pReset">配置をリセット</button><button id="pDel" class="danger">削除</button></div>
          <div class="btnrow"><button id="pSplit">このパーツをさらに分ける（目・口など）</button></div>

          <div class="sect">メッシュ<span id="mInfo"></span></div>
          <label class="f">細かさ<span class="v" id="mDivV"></span><input id="mDiv" type="range" min="2" max="40" step="1"></label>
          <div class="btnrow"><button id="mAuto">メッシュを自動生成</button><button id="mQuad">四角に戻す</button></div>
          <div class="btnrow"><button id="mShow">メッシュを表示</button><button id="mResetDef">変形をリセット</button></div>
        </div>
      </div>
    </aside>
  </main>

  <nav class="bottom">
    <div class="seg">
      <button id="modeView" class="on">視点</button>
      <button id="modeMove">移動</button>
      <button id="modeDeform">変形</button>
    </div>
    <button id="fitBtn" aria-label="全体表示"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button id="sheetBtn" aria-label="パーツ一覧"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
  </nav>

  <div id="menu" class="menu hidden">
    <button data-act="open">PSD・画像を開く</button>
    <button data-act="openMulti">画像を複数まとめて開く</button>
    <button data-act="sample">サンプルを開く</button>
    <hr>
    <button data-act="split">1枚絵からパーツ分け</button>
    <button data-act="meshAll">全パーツにメッシュを自動生成</button>
    <hr>
    <button data-act="saveProj">プロジェクトを保存（.json）</button>
    <button data-act="exportPng">PNGで書き出す</button>
    <hr>
    <button data-act="close" class="danger">作業を閉じる</button>
  </div>
  <input type="file" id="fileIn" hidden>

      <button id="spDone" class="sm on">完了</button>
    </div>

    <div class="sp-panel">

        <div class="seg"><button data-tool="ai">✨ AI</button><button data-tool="paint" class="on">塗る</button><button data-tool="erase">消す</button><button data-tool="wand">色で選択</button></div>
        <div id="spAiBar" class="sp-aibar hidden"><div class="seg"><button data-ais="1" class="on">＋ 選ぶ</button><button data-ais="0">− 除く</button></div><button id="spAiSize">範囲：-</button><button id="spAiReset">点を消す</button></div>

  <div id="toast"></div>

<script>
'use strict';
/* =========================================================
   ポケットリグ  step1
   - PSD/PNG読み込み → パーツ化 → WebGL表示
   - 選択・移動・回転・拡大・不透明度・表示・描画順
   - 元に戻す / やり直す、自動保存(IndexedDB)、.json保存、PNG書き出し
   ========================================================= */
const $ = s => document.querySelector(s);
const App = {
  doc: null,            // {name, w, h}
  parts: [],            // 描画順（奥→手前）
  byId: new Map(),
  sel: null,
  mode: 'view',
  cam: { s: 1, x: 0, y: 0 },
  undo: [], redo: [], last: null,
  nextId: 1,
};
window.__app = App;

/* ---------- 小物 ---------- */
const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const tick = () => new Promise(r => setTimeout(r, 0));
let toastTimer;
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}
function loading(on, text) {
  $('#loading').classList.toggle('hidden', !on);
  if (text) $('#loadingText').textContent = text;
}

/* =========================================================
   PSD パーサ
   ========================================================= */
const BLEND = {
  'norm': 'source-over', 'mul ': 'multiply', 'scrn': 'screen', 'over': 'overlay', 'dark': 'darken',
  'lite': 'lighten', 'div ': 'color-dodge', 'idiv': 'color-burn', 'hLit': 'hard-light', 'sLit': 'soft-light',
  'diff': 'difference', 'smud': 'exclusion', 'hue ': 'hue', 'sat ': 'saturation', 'colr': 'color',
  'lum ': 'luminosity', 'lddg': 'lighter'
};

function unpackBits(src, s, e, dst, off, w) {
  let i = s, o = off; const oe = off + w;
  while (i < e && o < oe) {
    let n = src[i++];
    if (n > 128) { n = 257 - n; const v = src[i++]; dst.fill(v, o, Math.min(o + n, oe)); o += n; }
    else if (n < 128) { n += 1; const take = Math.min(n, oe - o); dst.set(src.subarray(i, i + take), o); i += n; o += n; }
  }
}

async function inflate(u8) {
  if (typeof DecompressionStream === 'undefined') throw new Error('この端末のブラウザではZIP圧縮のPSDを読めません');
  const stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function parsePSD(buf, onProgress) {
  const dv = new DataView(buf), bytes = new Uint8Array(buf);
  let p = 0;
  const u8 = () => bytes[p++];
  const u16 = () => { const v = dv.getUint16(p); p += 2; return v; };
  const i16 = () => { const v = dv.getInt16(p); p += 2; return v; };
  const u32 = () => { const v = dv.getUint32(p); p += 4; return v; };
  const i32 = () => { const v = dv.getInt32(p); p += 4; return v; };
  const str = n => { let s = ''; for (let i = 0; i < n; i++) s += String.fromCharCode(bytes[p++]); return s; };

  if (str(4) !== '8BPS') throw new Error('PSDファイルではありません');
  const ver = u16();
  if (ver !== 1) throw new Error('PSB形式（大容量PSD）は未対応です。PSDで保存し直してください');
  p += 6;
  const nch = u16(), H = u32(), W = u32(), depth = u16(), mode = u16();
  if (depth !== 8) throw new Error(depth + 'bitのPSDは未対応です。8bitで保存し直してください');
  if (mode !== 3 && mode !== 1) throw new Error('RGBカラーのPSDにしてください（CMYKなどは未対応）');
  const cmLen = u32(); p += cmLen;     // カラーモードデータ
  const irLen = u32(); p += irLen;     // 画像リソース

  let sjis = null;
  try { sjis = new TextDecoder('shift_jis'); } catch (e) { }
  const decodeName = arr => {
    if (sjis) { try { return sjis.decode(arr); } catch (e) { } }
    return String.fromCharCode(...arr);
  };

  function readRecord() {
    const r = {};
    r.top = i32(); r.left = i32(); r.bottom = i32(); r.right = i32();
    const cn = u16(); r.channels = [];
    for (let i = 0; i < cn; i++) r.channels.push({ id: i16(), len: u32() });
    p += 4; // '8BIM'
    r.blend = str(4); r.opacity = u8(); r.clipping = u8(); const flags = u8(); p++;
    r.hidden = !!(flags & 2);
    const exLen = u32(), exEnd = p + exLen;
    const mLen = u32(); p += mLen;           // レイヤーマスク（未使用）
    const brLen = u32(); p += brLen;         // ブレンド条件
    const nameStart = p, nl = u8();
    r.name = decodeName(bytes.subarray(p, p + nl));
    p = nameStart + Math.ceil((nl + 1) / 4) * 4;     // 4バイト境界まで詰め物
    r.section = 0;
    while (p + 12 <= exEnd) {
      const sig = str(4);
      if (sig !== '8BIM' && sig !== '8B64') break;
      const key = str(4), len = u32(), s = p;
      if (key === 'luni') {
        const n = u32(); let s2 = '';
        for (let i = 0; i < n; i++) s2 += String.fromCharCode(u16());
        r.name = s2.replace(/\0+$/, '');
      } else if (key === 'lsct' || key === 'lsdk') {
        r.section = u32();
      }
      p = s + len;
    }
    p = exEnd;
    return r;
  }

  async function decodePlane(comp, w, h, end) {
    const out = new Uint8Array(w * h);
    if (comp === 0) {
      out.set(bytes.subarray(p, Math.min(p + w * h, end)));
    } else if (comp === 1) {
      const counts = new Uint16Array(h);
      for (let y = 0; y < h; y++) counts[y] = u16();
      let q = p;
      for (let y = 0; y < h; y++) { unpackBits(bytes, q, q + counts[y], out, y * w, w); q += counts[y]; }
    } else if (comp === 2 || comp === 3) {
      const raw = await inflate(bytes.subarray(p, end));
      out.set(raw.subarray(0, w * h));
      if (comp === 3) for (let y = 0; y < h; y++) for (let x = 1, i = y * w + 1; x < w; x++, i++) out[i] = (out[i] + out[i - 1]) & 255;
    } else throw new Error('未対応の圧縮形式です');
    return out;
  }

  async function readChannels(r) {
    const w = r.right - r.left, h = r.bottom - r.top;
    const planes = {};
    for (const ch of r.channels) {
      const end = p + ch.len;
      if (ch.len < 2) { p = end; continue; }
      const comp = u16();
      if (ch.id < -1 || ch.id > 2 || w <= 0 || h <= 0) { p = end; continue; }
      planes[ch.id] = await decodePlane(comp, w, h, end);
      p = end;
    }
    if (w > 0 && h > 0 && planes[0]) {
      const n = w * h, rgba = new Uint8ClampedArray(n * 4);
      const R = planes[0], G = planes[1] || R, B = planes[2] || R, A = planes[-1];
      for (let i = 0, j = 0; i < n; i++, j += 4) {
        rgba[j] = R[i]; rgba[j + 1] = G[i]; rgba[j + 2] = B[i]; rgba[j + 3] = A ? A[i] : 255;
      }
      r.rgba = rgba; r.w = w; r.h = h;
    }
  }

  const layers = [];
  const lmLen = u32(), lmEnd = p + lmLen;
  if (lmLen > 0) {
    const liLen = u32();
    if (liLen > 0) {
      const count = Math.abs(i16());
      const recs = [];
      for (let i = 0; i < count; i++) recs.push(readRecord());
      for (let i = 0; i < recs.length; i++) {
        await readChannels(recs[i]);
        layers.push(recs[i]);
        if (onProgress && i % 3 === 0) await onProgress(i / recs.length);
      }
    }
  }
  p = lmEnd;

  let merged = null;
  if (!layers.some(l => l.rgba)) {
    // レイヤーが無いPSD → 統合画像を1枚のパーツにする
    const comp = u16(), n = W * H, planes = [];
    if (comp === 1) {
      const counts = []; for (let c = 0; c < nch; c++) for (let y = 0; y < H; y++) counts.push(u16());
      let k = 0;
      for (let c = 0; c < nch; c++) {
        const out = new Uint8Array(n);
        for (let y = 0; y < H; y++) { const len = counts[k++]; unpackBits(bytes, p, p + len, out, y * W, W); p += len; }
        planes.push(out);
      }
    } else if (comp === 0) {
      for (let c = 0; c < nch; c++) { planes.push(bytes.slice(p, p + n)); p += n; }
    } else throw new Error('この統合画像の形式には未対応です');
    const R = planes[0], G = mode === 3 ? planes[1] : R, B = mode === 3 ? planes[2] : R;
    const rgba = new Uint8ClampedArray(n * 4);
    for (let i = 0, j = 0; i < n; i++, j += 4) { rgba[j] = R[i]; rgba[j + 1] = G[i]; rgba[j + 2] = B[i]; rgba[j + 3] = 255; }
    merged = { rgba, w: W, h: H };
  }
  return { width: W, height: H, layers, merged };
}

function rgbaToCanvas(rgba, w, h) {
  const c = mkCanvas(w, h);
  c.getContext('2d').putImageData(new ImageData(rgba, w, h), 0, 0);
  return c;
}

/* PSDのレイヤー → パーツ定義（グループ名・クリッピング焼き込み） */
function psdToDefs(psd) {
  const items = [], stack = [], L = psd.layers;
  for (let i = L.length - 1; i >= 0; i--) {        // 手前 → 奥 の順で辿るとグループ構造が分かる
    const l = L[i];
    if (l.section === 1 || l.section === 2) { stack.push({ name: l.name, visible: !l.hidden, opacity: l.opacity / 255 }); continue; }
    if (l.section === 3) { stack.pop(); continue; }
    let vis = !l.hidden, op = l.opacity / 255;
    for (const g of stack) { if (!g.visible) vis = false; op *= g.opacity; }
    items.push({ l, group: stack.map(g => g.name).join(' / '), visible: vis, opacity: op });
  }
  items.reverse();                                   // 奥 → 手前
  const defs = []; let base = null; const info = { clipped: 0, blends: 0 };
  for (const it of items) {
    const l = it.l;
    if (l.clipping && base) {
      if (it.visible && l.rgba) { bakeClip(base, it); info.clipped++; }
      continue;
    }
    if (!l.rgba) { base = null; continue; }
    base = {
      canvas: rgbaToCanvas(l.rgba, l.w, l.h), left: l.left, top: l.top,
      name: l.name || 'レイヤー', group: it.group, visible: it.visible, opacity: it.opacity, blend: l.blend
    };
    if (l.blend !== 'norm' && l.blend !== 'pass') info.blends++;
    defs.push(base);
  }
  return { defs, info };
}

function bakeClip(base, it) {
  const l = it.l, src = rgbaToCanvas(l.rgba, l.w, l.h);
  const w = base.canvas.width, h = base.canvas.height;
  const t = mkCanvas(w, h), c = t.getContext('2d', { willReadFrequently: true });
  c.drawImage(base.canvas, 0, 0);
  c.globalAlpha = it.opacity;
  c.globalCompositeOperation = BLEND[l.blend] || 'source-over';
  c.drawImage(src, l.left - base.left, l.top - base.top);
  const a = c.getImageData(0, 0, w, h);
  const b = base.canvas.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, w, h);
  for (let i = 3; i < a.data.length; i += 4) a.data[i] = b.data[i];   // 下のレイヤーの形で切り抜く
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  c.putImageData(a, 0, 0);
  base.canvas = t;
}

/* =========================================================
   パーツ
   ========================================================= */
function makePart(d) {
  let c = d.canvas, left = d.left || 0, top = d.top || 0, w = c.width, h = c.height;
  let data = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, w, h).data;
  if (d.trim !== false) {                            // 透明な余白を切り詰める
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (data[(y * w + x) * 4 + 3] > 0) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    if (x1 < 0) return null;                         // 完全に透明
    if (x0 > 0 || y0 > 0 || x1 < w - 1 || y1 < h - 1) {
      const nw = x1 - x0 + 1, nh = y1 - y0 + 1, nc = mkCanvas(nw, nh);
      const ctx = nc.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(c, -x0, -y0);
      c = nc; left += x0; top += y0; w = nw; h = nh;
      data = ctx.getImageData(0, 0, w, h).data;
    }
  }
  const alpha = new Uint8Array(w * h);
  for (let i = 0; i < alpha.length; i++) alpha[i] = data[i * 4 + 3];
  const T = 80, k = Math.min(T / w, T / h), tc = mkCanvas(T, T);
  tc.getContext('2d').drawImage(c, (T - w * k) / 2, (T - h * k) / 2, w * k, h * k);
  const id = d.id && !App.byId.has(d.id) ? d.id : App.nextId;
  App.nextId = Math.max(App.nextId, id + 1);
  const part = {
    id, name: d.name || 'パーツ', group: d.group || '', blend: d.blend || 'norm',
    left, top, w, h, canvas: c, alpha, thumb: tc.toDataURL(), blob: d.blob || null, tex: null,
    visible: d.visible !== false,
    mesh: d.mesh ? { verts: Float32Array.from(d.mesh.verts), tris: Uint16Array.from(d.mesh.tris) } : quadMesh(w, h),
    div: d.div || 12,                                   // メッシュの細かさ
    base: baseOf(d),                                    // 基本の形
    binds: parseBinds(d.binds),                         // パラメータごとの差分
    // ↓ 表示用（基本＋パラメータを合成した結果。evaluate() が書き込む）
    x: 0, y: 0, rot: 0, scale: 1, opacity: 1, offs: null,
  };
  evaluate(part);
  App.byId.set(id, part);
  return part;
}

/* =========================================================
   パラメータ
   - p.base               : 基本の形（位置・回転・拡大・不透明度・変形）
   - p.binds[パラメータID][キー値] : そのキーでの差分
   - 表示 = 基本 ＋ 各パラメータの差分（前後のキーで直線補間）を足し合わせたもの
   - base / binds / キーの中身は「書き換えずに作り直す」→ 元に戻すは参照を持つだけで済む
   ========================================================= */
App.params = [];           // {id, name, min, max, def, value}
App.editParam = null;      // 編集中のパラメータID
App.nextParamId = 1;
const FIELDS = ['x', 'y', 'rot', 'scale', 'opacity'];
const keyStr = v => String(Math.round(v * 1000) / 1000);
function baseOf(d) {
  return { x: d.x || 0, y: d.y || 0, rot: d.rot || 0, scale: d.scale == null ? 1 : d.scale, opacity: d.opacity == null ? 1 : d.opacity, offs: d.offs ? Float32Array.from(d.offs) : null };
}
function parseBinds(b) {
  const out = {};
  if (!b) return out;
  for (const pid in b) {
    out[pid] = {};
    for (const k in b[pid]) { const o = b[pid][k]; out[pid][k] = { x: o.x || 0, y: o.y || 0, rot: o.rot || 0, scale: o.scale || 0, opacity: o.opacity || 0, offs: o.offs ? Float32Array.from(o.offs) : null }; }
  }
  return out;
}
const zeroAcc = () => ({ x: 0, y: 0, rot: 0, scale: 0, opacity: 0, offs: null });
function addOffs(acc, o, w, n) {
  if (!o || !w) return;
  if (!acc.offs) acc.offs = new Float32Array(n);
  for (let i = 0; i < n; i++) acc.offs[i] += o[i] * w;
}
/* パーツ p にパラメータ q が与える差分を acc に足す */
function interpAdd(acc, p, q) {
  const b = p.binds[q.id]; if (!b) return;
  const ks = Object.keys(b).map(Number); if (!ks.includes(q.def)) ks.push(q.def);
  ks.sort((a, c) => a - c);
  const v = q.value; let i = 0;
  while (i < ks.length - 2 && v > ks[i + 1]) i++;
  const k0 = ks[i], k1 = ks[Math.min(i + 1, ks.length - 1)];
  const t = k1 === k0 ? 0 : clamp((v - k0) / (k1 - k0), 0, 1);
  const a = b[keyStr(k0)], c = b[keyStr(k1)], n = p.mesh.verts.length;
  for (const f of FIELDS) acc[f] += (a ? a[f] : 0) * (1 - t) + (c ? c[f] : 0) * t;
  addOffs(acc, a && a.offs, 1 - t, n); addOffs(acc, c && c.offs, t, n);
}
function sumDeltas(p, exceptId) {
  const acc = zeroAcc();
  for (const q of App.params) if (q.id !== exceptId) interpAdd(acc, p, q);
  return acc;
}
function combineOffs(a, b, sign = 1) {
  if (!a && !b) return null;
  const n = (a || b).length, out = new Float32Array(n);
  for (let i = 0; i < n; i++) out[i] = (a ? a[i] : 0) + sign * (b ? b[i] : 0);
  return out;
}
function evaluate(p) {
  const acc = sumDeltas(p, null), B = p.base;
  p.x = B.x + acc.x; p.y = B.y + acc.y; p.rot = B.rot + acc.rot;
  p.scale = Math.max(0.01, B.scale + acc.scale); p.opacity = clamp(B.opacity + acc.opacity, 0, 1);
  p.offs = combineOffs(B.offs, acc.offs);
}
function evaluateAll() {
  for (const p of App.parts) evaluate(p); requestRender();
  if (!inFrame && App.physOn && App.physics.length) wake();      // 揺れの計算を起こす
}

/* いま編集しているのは「基本の形」か「あるパラメータのキー」か */
function editTarget() {
  const q = App.params.find(q => q.id === App.editParam);
  if (!q || Math.abs(q.value - q.def) < 1e-6) return null;
  return { q, key: keyStr(q.value) };
}
function targetState(p) {
  const t = editTarget();
  if (!t) return p.base;
  const b = p.binds[t.q.id];
  return (b && b[t.key]) || null;
}
function setTarget(p, val) {
  const t = editTarget();
  if (!t) { p.base = val; return; }
  const nb = { ...p.binds }; nb[t.q.id] = { ...(nb[t.q.id] || {}), [t.key]: val }; p.binds = nb;
}
function cleanOffs(o) {
  if (!o) return null;
  for (let i = 0; i < o.length; i++) if (Math.abs(o[i]) > 1e-3) return o;
  return null;
}
/* 画面上で変えた表示状態を、編集先（基本 or キー）に書き戻す */
function absorb(p) {
  const t = editTarget(), acc = sumDeltas(p, t ? t.q.id : null);
  if (!t) {
    setTarget(p, { x: p.x - acc.x, y: p.y - acc.y, rot: p.rot - acc.rot, scale: p.scale - acc.scale, opacity: p.opacity - acc.opacity, offs: cleanOffs(combineOffs(p.offs, acc.offs, -1)) });
  } else {
    const B = p.base, ro = combineOffs(B.offs, acc.offs);

  },
  put(k, v) { return this.run('readwrite', s => s.put(v, k)); },
  get(k) { return this.run('readonly', s => s.get(k)); },
  del(k) { return this.run('readwrite', s => s.delete(k)); },
};

  const f = files[0];

  try {
    if (sig === '8BPS') await importPSD(f);
    else if (head[0] === 0x7b || /\.json$/i.test(f.name)) await importProject(f);
    else {
      const imgs = files.filter(x => /^image\//.test(x.type) || /\.(png|jpe?g|webp|gif)$/i.test(x.name));
      if (!imgs.length) throw new Error('対応していないファイルです（PSD・PNG・プロジェクト.jsonに対応）');
      await importImages(imgs);

  } catch (e) { console.error(e); toast('読み込めませんでした：' + e.message, 5000); }
  finally { loading(false); }
}

  if (psd.merged) defs = [{ canvas: rgbaToCanvas(psd.merged.rgba, psd.merged.w, psd.merged.h), name: '画像全体' }];
  else ({ defs, info } = psdToDefs(psd));
  if (!defs.length) throw new Error('絵の入ったレイヤーが見つかりません');
  await setDoc({ name: file.name.replace(/\.psd$/i, ''), w: psd.width, h: psd.height }, defs);
  const notes = [];
  if (psd.merged) notes.push('レイヤー情報が無いため1枚の画像として開きました');
  if (info.clipped) notes.push(`クリッピング${info.clipped}枚を下のパーツに合成`);
  if (info.blends) notes.push(`乗算などの合成モード${info.blends}枚は通常表示`);
  toast(`${App.parts.length}パーツを読み込みました` + (notes.length ? '\n' + notes.join('・') : ''), 4500);
  if (App.parts.length === 1) offerSplit();
}
async function importImages(files) {
  loading(true, '画像を読み込み中…');
  const defs = []; let W = 0, H = 0;
  for (const f of files) {
    const c = await blobToCanvas(f);
    W = Math.max(W, c.width); H = Math.max(H, c.height);
    defs.push({ canvas: c, name: f.name.replace(/\.[^.]+$/, '') });
  }
  await setDoc({ name: files.length === 1 ? defs[0].name : '画像パーツ', w: W, h: H }, defs);
  if (App.parts.length === 1) offerSplit(); else toast(`${App.parts.length}パーツを読み込みました`);
}
async function importProject(file) {
  loading(true, 'プロジェクトを読み込み中…');
  const data = JSON.parse(await file.text());
  if (data.app !== 'PocketRig' || !Array.isArray(data.parts)) throw new Error('ポケットリグのプロジェクトではありません');
  const defs = [];
  for (const d of data.parts) {
    const blob = await (await fetch(d.png)).blob();
    defs.push({ ...d, blob, canvas: await blobToCanvas(blob), trim: false });
  }
  await setDoc(data.doc, defs, { ...data, sel: null });
  toast('プロジェクトを開きました');
}

/* サンプルに「目の開閉」「顔の向き」を最初から付けておく */
function addSampleRig() {
  const P = n => App.parts.find(p => p.name === n), Z = { x: 0, y: 0, rot: 0, scale: 0, opacity: 0, offs: null };
  const blink = { id: App.nextParamId++, name: '目の開閉', min: 0, max: 1, def: 1, value: 1 };
  const turn = { id: App.nextParamId++, name: '顔の向き 左右', min: -30, max: 30, def: 0, value: 0 };
  App.params = [blink, turn];
  for (const n of ['左目', '右目']) {
    const p = P(n); p.mesh = autoMesh(p, 8);
    const V = p.mesh.verts, o = new Float32Array(V.length), cy = p.h * 0.62;
    for (let i = 1; i < V.length; i += 2) o[i] = (cy - V[i]) * 0.92;      // 縦につぶして閉じ目に
    p.binds = { [blink.id]: { '0': { ...Z, offs: o } } };
  }
  for (const [n, dx] of [['左目', 16], ['右目', 16], ['口', 14], ['頬', 12], ['前髪', 9], ['アホ毛', 7], ['顔', 4], ['後ろ髪', -6]]) {
    const p = P(n);
    p.binds = { ...p.binds, [turn.id]: { '30': { ...Z, x: dx }, '-30': { ...Z, x: -dx } } };
  }
  // 髪揺れ：アホ毛は回転、後ろ髪は下ほど横にずれる
  const sway = { id: App.nextParamId++, name: '髪揺れ', min: -1, max: 1, def: 0, value: 0 };
  App.params.push(sway);
  const ah = P('アホ毛');
  ah.binds = { ...ah.binds, [sway.id]: { '1': { ...Z, rot: 22 }, '-1': { ...Z, rot: -22 } } };
  for (const [n, amt] of [['後ろ髪', 34], ['前髪', 8]]) {
    const p = P(n); p.mesh = autoMesh(p, 10);
    const V = p.mesh.verts, o = new Float32Array(V.length);
    for (let i = 0; i < V.length; i += 2) o[i] = Math.pow(V[i + 1] / p.h, 1.6) * amt;
    p.binds = { ...p.binds, [sway.id]: { '1': { ...Z, offs: o }, '-1': { ...Z, offs: o.map(v => -v) } } };
  }
  App.physics = [{ id: App.nextPhysId++, name: '髪の揺れ', inp: turn.id, out: sway.id, len: 0.55, damp: 3, str: 1, inv: false }];
  // 首ふり＋まばたきのモーション
  App.motions = [{
    id: App.nextMotionId++, name: '首ふりとまばたき', dur: 4, loop: true, tracks: {
      [turn.id]: [[0, 0], [0.8, 24], [1.8, 24], [2.8, -24], [3.4, -24], [4, 0]],
      [blink.id]: [[0, 1], [1.2, 1], [1.28, 0], [1.36, 0], [1.44, 1], [3.6, 1], [3.68, 0], [3.76, 0], [3.84, 1]],
    }
  }];
  App.curMotion = App.motions[0].id;
  evaluateAll(); App.last = snapshot(); renderParams(); renderPhys(); renderMotion(); scheduleSave();
}

const fmtV = v => Math.abs(v) >= 10 ? v.toFixed(0) : v.toFixed(2);
const PRESETS = [
  { name: '左目の開閉', min: 0, max: 1, def: 1, sub: '0＝閉じる / 1＝開く' },
  { name: '右目の開閉', min: 0, max: 1, def: 1, sub: '0＝閉じる / 1＝開く' },

function addParam(def) {
  let name = def.name, n = 2;
  while (App.params.some(q => q.name === name)) name = `${def.name} ${n++}`;
  const q = { id: App.nextParamId++, name, min: def.min, max: def.max, def: def.def, value: def.def };
  App.params = [...App.params, q];
  App.editParam = q.id;
  commit(); renderParams(); setMode(App.mode); updateProps();
  toast(`「${name}」を作りました。\nスライダーを動かしてから、変形や移動で形を作るとキーが登録されます`, 5000);
}
$('#addParam').onclick = () => {
  if (!App.doc) return toast('まだ何も開いていません');
  showActions('パラメータを追加', [
    ...PRESETS.map(p => ({ label: p.name, sub: p.sub, fn: () => addParam(p) })),
    {
      label: '自由に作る', sub: '名前と範囲を自分で決める', fn: () => {
        const name = prompt('パラメータの名前', 'パラメータ'); if (!name) return;
        const r = parseRange(prompt('最小,最大,初期値（半角カンマ区切り）', '0,1,0')); if (!r) return;

};
function parseRange(s) {
  if (!s) return null;
  const [min, max, def] = s.split(/[,，、\s]+/).map(Number);
  if ([min, max, def].some(isNaN) || min >= max || def < min || def > max) { toast('「最小,最大,初期値」の順で、最小＜最大、初期値はその範囲内で入力してください', 4000); return null; }
  return { min, max, def };
}
function renderParams() {

    el.innerHTML = '<div class="prm-empty">パラメータがありません。<br>上の「✨ おまかせ」でまとめて作るか、「＋ 追加」で「目の開閉」などを作り、スライダーの値ごとに形を登録すると、その間がなめらかにアニメーションします。</div>';

  el.innerHTML = App.params.map(q => {
    const armed = q.id === App.editParam, step = (q.max - q.min) / 200;
    return `<div class="prm${armed ? ' armed' : ''}" data-pid="${q.id}">
      <div class="prm-h"><button class="pname" data-more="${q.id}">${esc(q.name)}${physOutputs().has(q.id) ? ' <small style="color:var(--accent2);font-weight:400">揺れで自動</small>' : ''}</button>
        <span class="pval" id="pv${q.id}">${fmtV(q.value)}</span>
        <button class="sm${armed ? ' on' : ''}" data-arm="${q.id}">${armed ? '編集中' : '編集'}</button></div>
      <div class="prm-s"><input type="range" min="${q.min}" max="${q.max}" step="${step}" value="${q.value}" data-slide="${q.id}">
        <div class="ticks" id="tk${q.id}">${ticksHTML(q)}</div></div>
      ${armed ? `<div class="prm-k" id="pk${q.id}">${keysHTML(q)}</div>` : ''}
    </div>`;
  }).join('');
}
function ticksHTML(q) {
  return paramKeys(q).map(k => `<i class="${k === q.def ? 'def' : ''}${Math.abs(k - q.value) < 1e-6 ? ' cur' : ''}" style="left:${(k - q.min) / (q.max - q.min) * 100}%"></i>`).join('');
}
function keysHTML(q) {
  const ks = paramKeys(q), t = editTarget();
  let h = 'キー：' + ks.map(k => `<button data-jump="${q.id}" data-k="${k}" class="${Math.abs(k - q.value) < 1e-6 ? 'on' : ''}">${fmtV(k)}${k === q.def ? '（基本）' : ''}</button>`).join('');
  if (t && ks.some(k => keyStr(k) === t.key)) h += `<button data-delkey="${q.id}" class="danger">このキーを削除</button>`;
  else if (t) h += `<span>← ${fmtV(q.value)} で形を変えると新しいキーになります</span>`;

function refreshParamUI(q) {

});
$('#paramList').addEventListener('change', e => { if (e.target.dataset.slide) { const q = App.params.find(q => q.id === +e.target.dataset.slide); e.target.value = q.value; scheduleSave(); } });
$('#paramList').addEventListener('click', e => {

    const items = [];
    if (sel && sel.binds[q.id] && sel.binds[q.id][key]) items.push({ label: `「${sel.name}」のキーだけ削除`, fn: () => delKey(q, key, [sel]) });

    showActions(`「${q.name}」のキー ${fmtV(q.value)}`, items);

      { label: 'このパラメータを削除', danger: true, fn: () => {
        if (!confirm(`「${q.name}」と、それに登録した形をすべて削除しますか？`)) return;
        for (const p of App.parts) if (p.binds[q.id]) { const nb = { ...p.binds }; delete nb[q.id]; p.binds = nb; }
        App.params = App.params.filter(x => x !== q); if (App.editParam === q.id) App.editParam = null;
        commit(); evaluateAll(); renderParams(); renderList(); updateProps(); setMode(App.mode);

function replaceParam(q, patch) {
  const nq = { ...q, ...patch }; nq.value = clamp(nq.value, nq.min, nq.max);
  App.params = App.params.map(x => x === q ? nq : x);
  commit(); evaluateAll(); renderParams(); updateProps(); setMode(App.mode);
}
function delKey(q, key, parts) {
  for (const p of parts) {
    const b = p.binds[q.id]; if (!b || !b[key]) continue;
    const nb = { ...p.binds }, m = { ...b }; delete m[key];
    if (Object.keys(m).length) nb[q.id] = m; else delete nb[q.id];
    p.binds = nb;
  }
  commit(); evaluateAll(); renderParams(); renderList(); updateProps(); setMode(App.mode);
  toast('キーを削除しました（元に戻せます）');
}

/* 自動プレビュー：全パラメータをゆらゆら動かす */
let playRaf = 0, playSaved = null;
function stopPlay() {
  if (!playRaf) return;
  cancelAnimationFrame(playRaf); playRaf = 0;
  for (const q of App.params) if (playSaved && playSaved.has(q.id)) q.value = playSaved.get(q.id);
  $('#playParams').textContent = '▶ 動かす';
  evaluateAll(); renderParams(); updateProps(); scheduleSave();
}
$('#playParams').onclick = () => {
  if (playRaf) return stopPlay();
  if (!App.params.length) return toast('先にパラメータを追加してください');
  App.editParam = null; renderParams(); renderList(); setMode(App.mode);
  playSaved = new Map(App.params.map(q => [q.id, q.value]));
  $('#playParams').textContent = '■ 止める';
  const t0 = performance.now();
  const loop = now => {
    const t = (now - t0) / 1000;
    App.params.forEach((q, i) => {
      const mid = (q.min + q.max) / 2, amp = (q.max - q.min) / 2, period = 2.2 + i * 0.45;
      q.value = mid + amp * Math.sin(t * Math.PI * 2 / period + i * 1.3);
      const pv = $('#pv' + q.id); if (pv) pv.textContent = fmtV(q.value);
      const sl = document.querySelector(`[data-slide="${q.id}"]`); if (sl) sl.value = q.value;
    });
    evaluateAll();
    playRaf = requestAnimationFrame(loop);
  };
  playRaf = requestAnimationFrame(loop);
};

/* =========================================================
   毎フレームの処理（モーション再生・物理演算）
   必要なときだけ動き、落ち着いたら止まる
   ========================================================= */
let frameRaf = 0, frameLast = 0, inFrame = false;
function wake() { if (!frameRaf && !inFrame) { frameLast = performance.now(); frameRaf = requestAnimationFrame(frame); } }
function frame(now) {
  frameRaf = 0;
  const dt = Math.min(0.05, Math.max(0.001, (now - frameLast) / 1000)); frameLast = now;
  let active = false;
  inFrame = true;
  try {
    if (MO.playing) { motionStep(dt); active = true; }
    if (stepPhysics(dt)) active = true;
    evaluateAll(); liveParamUI();
  } finally { inFrame = false; }
  if (active) frameRaf = requestAnimationFrame(frame);
}
/* スライダーなど表示中の数値だけ更新（DOMを作り直さない） */
function liveParamUI() {
  for (const q of App.params) {
    const pv = $('#pv' + q.id); if (pv) pv.textContent = fmtV(q.value);
    const sl = document.querySelector(`[data-slide="${q.id}"]`); if (sl && document.activeElement !== sl) sl.value = q.value;
    const mv = $('#mv' + q.id); if (mv) mv.textContent = fmtV(q.value);
    const ms = document.querySelector(`[data-mslide="${q.id}"]`); if (ms && !MO.touched.has(q.id)) ms.value = q.value;
  }
  if (!$('#motionPane').classList.contains('hidden')) motionTimeUI();
}

/* =========================================================
   物理演算（揺れ）
   「動きの元」パラメータの変化を振り子の支点の動きとみなし、
   振り子の角度を「揺らすパラメータ」に書き込む
   ========================================================= */
App.physics = [];           // {id, name, inp, out, len, damp, str, inv}
App.physOn = true;
App.nextPhysId = 1;
const PH = new Map();       // 振り子の状態（保存しない）
const normParam = q => q.value >= q.def ? (q.max > q.def ? (q.value - q.def) / (q.max - q.def) : 0) : (q.def > q.min ? (q.value - q.def) / (q.def - q.min) : 0);

function stepPhysics(dt) {
  if (!App.physOn || !App.physics.length) return false;
  let moving = false;
  for (const g of App.physics) {
    const qi = App.params.find(q => q.id === g.inp), qo = App.params.find(q => q.id === g.out);
    if (!qi || !qo || qi === qo || qo.id === App.editParam || MO.touched.has(qo.id)) continue;
    const u = normParam(qi) * (g.inv ? -1 : 1);
    let st = PH.get(g.id);
    if (!st) { st = { th: 0, om: 0, X: u, V: 0 }; PH.set(g.id, st); }
    const V = (u - st.X) / dt, A = clamp((V - st.V) / dt, -400, 400);
    const L = g.len, n = 4, h = dt / n;
    for (let i = 0; i < n; i++) {
      const al = -(9.8 / L) * Math.sin(st.th) - g.damp * st.om - (A * 0.2 / L) * Math.cos(st.th);
      st.om += al * h; st.th = clamp(st.th + st.om * h, -1.4, 1.4);
    }
    st.X = u; st.V = V;
    const o = clamp(st.th / 0.6 * g.str, -1, 1);
    qo.value = clamp(qo.def + o * (o > 0 ? qo.max - qo.def : qo.def - qo.min), qo.min, qo.max);
    if (Math.abs(st.om) > 0.002 || Math.abs(st.th) > 0.002 || Math.abs(V) > 1e-4) moving = true;
  }

}
function renderPhys() {
  const el = $('#physList'); $('#physOn').textContent = App.physOn ? 'ON' : 'OFF'; $('#physOn').classList.toggle('on', App.physOn);
  if (!App.physics.length) { el.innerHTML = '<div class="prm-empty">頭を動かしたときに髪などが遅れて揺れるようにできます。「＋ 揺れを追加」から作ってください。</div>'; return; }
  const opts = sel => App.params.map(q => `<option value="${q.id}"${q.id === sel ? ' selected' : ''}>${esc(q.name)}</option>`).join('');
  el.innerHTML = App.physics.map(g => `<div class="prm" data-gid="${g.id}">
    <div class="prm-h"><b style="flex:1">${esc(g.name)}</b><button class="sm danger" data-pdel="${g.id}">削除</button></div>
    <label class="f">動きの元（このパラメータが動くと揺れる）<select data-pk="inp">${opts(g.inp)}</select></label>
    <label class="f">揺らすパラメータ<select data-pk="out">${opts(g.out)}</select></label>
    <label class="f">揺れの長さ<span class="v">${g.len.toFixed(2)}</span><input type="range" data-pk="len" min="0.1" max="2" step="0.05" value="${g.len}"></label>
    <label class="f">止まりやすさ<span class="v">${g.damp.toFixed(1)}</span><input type="range" data-pk="damp" min="0.3" max="8" step="0.1" value="${g.damp}"></label>
    <label class="f">強さ<span class="v">${g.str.toFixed(2)}</span><input type="range" data-pk="str" min="0.1" max="3" step="0.05" value="${g.str}"></label>
    <label class="chk"><input type="checkbox" data-pk="inv"${g.inv ? ' checked' : ''}>揺れる向きを反転</label>
  </div>`).join('');
}
function patchPhys(id, patch, doCommit) {
  App.physics = App.physics.map(g => g.id === id ? { ...g, ...patch } : g);
  if (doCommit) commit();

}
$('#physList').addEventListener('input', e => {

/* =========================================================
   モーション（タイムライン）
   tracks[パラメータID] = [[秒, 値], ...]（時間順）
   ========================================================= */
App.motions = [];           // {id, name, dur, loop, tracks}
App.curMotion = null;
App.nextMotionId = 1;
const MO = { t: 0, playing: false, rec: false, touched: new Map() };
const curMo = () => App.motions.find(m => m.id === App.curMotion) || null;
function sampleTrack(tr, t) {
  if (!tr || !tr.length) return null;
  if (t <= tr[0][0]) return tr[0][1];
  const L = tr.length; if (t >= tr[L - 1][0]) return tr[L - 1][1];
  let lo = 0, hi = L - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (tr[m][0] <= t) lo = m; else hi = m; }
  const [t0, v0] = tr[lo], [t1, v1] = tr[hi], dt = t1 - t0;
  const a = tr[lo - 1] || tr[lo], b = tr[hi + 1] || tr[hi];
  // 前後のキーも見てなめらかにつなぐ（行き過ぎないよう2つのキーの間に収める）
  const m0 = a === tr[lo] ? v1 - v0 : (v1 - a[1]) / (t1 - a[0]) * dt;
  const m1 = b === tr[hi] ? v1 - v0 : (b[1] - v0) / (b[0] - t0) * dt;
  const u = (t - t0) / dt, u2 = u * u, u3 = u2 * u;
  const v = (2 * u3 - 3 * u2 + 1) * v0 + (u3 - 2 * u2 + u) * m0 + (-2 * u3 + 3 * u2) * v1 + (u3 - u2) * m1;
  return clamp(v, Math.min(v0, v1), Math.max(v0, v1));
}
function applyMotion(t) {
  const m = curMo(); if (!m) return;
  for (const q of App.params) {
    if (MO.touched.has(q.id)) continue;
    const v = sampleTrack(m.tracks[q.id], t);
    if (v != null) q.value = clamp(v, q.min, q.max);
  }
}
function motionStep(dt) {
  const m = curMo(); if (!m) { MO.playing = false; return; }
  MO.t += dt;
  if (MO.t >= m.dur) {
    if (MO.rec || !m.loop) { MO.t = m.dur; applyMotion(MO.t); recordSamples(); stopMotion(); return; }
    MO.t %= m.dur;
  }
  applyMotion(MO.t);
  recordSamples();
}
function recordSamples() {
  if (!MO.rec) return;
  for (const [pid, r] of MO.touched) {
    const q = App.params.find(q => q.id === pid); if (!q) continue;
    const last = r.samples[r.samples.length - 1];
    if (!last || MO.t - last[0] >= 1 / 20) r.samples.push([MO.t, q.value]);

}
/* 記録した細かい点を、形が変わらない範囲で間引く */
function simplify(pts, tol) {
  if (pts.length < 3) return pts.slice();
  const keep = new Uint8Array(pts.length); keep[0] = keep[pts.length - 1] = 1;
  const st = [[0, pts.length - 1]];
  while (st.length) {
    const [a, b] = st.pop(); let mi = -1, md = tol;
    for (let i = a + 1; i < b; i++) {
      const u = (pts[i][0] - pts[a][0]) / (pts[b][0] - pts[a][0] || 1);
      const d = Math.abs(pts[i][1] - (pts[a][1] + (pts[b][1] - pts[a][1]) * u));
      if (d > md) { md = d; mi = i; }
    }
    if (mi > 0) { keep[mi] = 1; st.push([a, mi], [mi, b]); }
  }

}
function setTrack(m, pid, track) {
  const tracks = { ...m.tracks };
  if (track && track.length) tracks[pid] = track; else delete tracks[pid];
  const nm = { ...m, tracks };
  App.motions = App.motions.map(x => x === m ? nm : x);
  return nm;
}
function finishTouch(pid) {
  const r = MO.touched.get(pid); MO.touched.delete(pid);
  const row = document.querySelector(`.mrow[data-mid="${pid}"]`); if (row) row.classList.remove('touch');
  const m = curMo(), q = App.params.find(q => q.id === pid);
  if (!r || !m || !q || r.samples.length < 1) return;
  const pts = simplify(r.samples, (q.max - q.min) * 0.004).map(([t, v]) => [Math.round(t * 1000) / 1000, Math.round(v * 1000) / 1000]);

  motionButtons(); motionTimeUI();

}
function motionButtons() {
  $('#moPlay').textContent = MO.playing && !MO.rec ? '■ 停止' : '▶ 再生';
  $('#moRec').textContent = MO.rec ? '■ 記録中' : '● 記録';
  $('#moRec').classList.toggle('on', MO.rec);
}
function motionTimeUI() {
  const m = curMo(); if (!m) return;
  $('#moT').textContent = MO.t.toFixed(2);
  const sc = $('#moScrub'); if (document.activeElement !== sc) sc.value = MO.t;
  drawLanes();
}
function renderMotion() {
  const sel = $('#moSel');
  sel.innerHTML = App.motions.length ? App.motions.map(m => `<option value="${m.id}"${m.id === App.curMotion ? ' selected' : ''}>${esc(m.name)}</option>`).join('') : '<option>（モーションなし）</option>';
  const m = curMo();
  $('#moBody').classList.toggle('hidden', !m); $('#moEmpty').classList.toggle('hidden', !!m);
  $('#moMore').disabled = !m;
  if (!m) {
    $('#moEmpty').innerHTML = App.params.length ? '「✨ おまかせ」で待機・うなずき・話すなどの動きを自動で作れます。<br>自分で作るときは「＋ 新規」→「● 記録」を押してから、下のスライダーを指で動かしてください。'
      : 'モーションはパラメータの動きを時間に沿って記録したものです。先に「パラメータ」タブでパラメータを作ってください。';
    return;

  const outs = physOutputs();
  $('#moRows').innerHTML = App.params.length ? App.params.map(q => `<div class="mrow" data-mid="${q.id}">
      <div class="mrow-h"><b>${esc(q.name)}${outs.has(q.id) ? '<em>揺れで自動</em>' : ''}</b><span id="mv${q.id}">${fmtV(q.value)}</span></div>
      <input type="range" data-mslide="${q.id}" min="${q.min}" max="${q.max}" step="${(q.max - q.min) / 200}" value="${q.value}">

function drawLanes() {
  const m = curMo(); if (!m) return;

    const w = cv.clientWidth, h = cv.clientHeight; if (!w) continue;
    if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);

      c.fillStyle = '#ff7aa8';

/* =========================================================
   モーションのおまかせ生成

   ========================================================= */
const ROLES = [
  { key: 'eyeL', label: '左目の開閉', kind: 'open', re: /左.*目|目.*左|eye.?l/i },
  { key: 'eyeR', label: '右目の開閉', kind: 'open', re: /右.*目|目.*右|eye.?r/i },
  { key: 'eyes', label: '両目の開閉', kind: 'open', re: /目|まばた|瞬|eye/i },

/* ---------- 穴埋め（プッシュ・プル法） ----------

/* ---------- 切り出す ---------- */
function spCut() {

/* =========================================================

    const T = await import(AI_LIB);

    const cb = d => {
      if (d.status === 'progress' && d.file) {

      }

    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      catch (e) { err = e; console.warn('AI load ' + o.device + '/' + o.dtype + ': ' + (e && e.message || e)); }
    }
    if (!AI.model) throw err || new Error('AIを読み込めませんでした');

}
async function aiEmbed() {

async function aiTap(mx, my) {

  AI.points.push([mx, my, AI.sign]);

  AI.busy = true; spDraw();
  try {
    await aiLoad(); await aiEmbed();
    do { AI.pending = false; spHintSet('AIが範囲を考えています…'); await aiDecode(); } while (AI.pending);
    spHintStep();
  } catch (e) {
    console.error(e);
    AI.points = [];
    spHintStep();
    const net = /load failed|failed to fetch|networkerror|fetch/i.test(String(e && e.message || e));
    toast(net
      ? 'AIのダウンロードができませんでした。\nClaudeアプリ内のプレビューなどでは外部からの読み込みが止められます。GitHub Pagesなどに置いて、Safari／Chromeで開いてください\n（それまでは「塗る」「色で選択」を使えます）'
      : 'AIを使えませんでした。「塗る」「色で選択」を使ってください\n（' + (e.message || e) + '）', 8000);

function aiReset() { AI.points = []; AI.mdata = null; $('#spAiSize').textContent = '範囲：-'; }

/* ---------- 操作 ---------- */
const spLocal = e => { const r = spCv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

spCv.addEventListener('pointerdown', e => {
  if (!SP.on || SP.steps[SP.cur].remainder) return;
  spCv.setPointerCapture(e.pointerId);

  if (SP.ptrs.size === 1) {

    const m = spModel(pt);
    if (SP.tool === 'ai') { aiTap(Math.floor(m[0]), Math.floor(m[1])); SP.g = null; return; }
    if (SP.tool === 'wand') {

      SP.g = null; spDraw(); return;

  }
});
function spRefreshBox(box) { if (SP.tool === 'erase') SP.mctx.clearRect(box[0], box[1], box[2] - box[0] + 1, box[3] - box[1] + 1); spMaskView(box[0], box[1], box[2], box[3]); spDraw(); }
spCv.addEventListener('pointermove', e => {

  const g = SP.g; if (!g) return;
  if (g.type === 'pinch' && SP.ptrs.size >= 2) {
    const [a, b] = [...SP.ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    const s = clamp(g.cam.s * d / g.d0, 0.05, 40), wx = (g.m0.x - g.cam.x) / g.cam.s, wy = (g.m0.y - g.cam.y) / g.cam.s;
    SP.cam = { s, x: m.x - wx * s, y: m.y - wy * s }; spDraw();
  } else if (g.type === 'paint') {
    const m = spModel(pt), box = [Infinity, Infinity, -Infinity, -Infinity];
    spLine(g.last, m, g.r, SP.tool === 'paint' ? 1 : 0, box); g.last = m;
    for (let k = 0; k < 2; k++) { g.box[k] = Math.min(g.box[k], box[k]); g.box[k + 2] = Math.max(g.box[k + 2], box[k + 2]); }
    SP.cursor = pt; spRefreshBox(box);
  }
});
function spEnd(e) {
  if (!SP.ptrs.has(e.pointerId)) return;
  SP.ptrs.delete(e.pointerId);
  const g = SP.g;
  if (g && g.type === 'paint' && SP.ptrs.size === 0) {
    if (SP.tool === 'paint' && $('#spSnap').checked) spSnap(g.box, g.r * 0.8);
    SP.g = null;
  } else if (g && g.type === 'pinch' && SP.ptrs.size < 2) SP.g = SP.ptrs.size ? { type: 'idle' } : null;
  SP.cursor = null; spDraw();
}
spCv.addEventListener('pointerup', spEnd);
spCv.addEventListener('pointercancel', spEnd);
spCv.addEventListener('wheel', e => {
  if (!SP.on) return; e.preventDefault();
  const pt = spLocal(e), s = clamp(SP.cam.s * Math.exp(-e.deltaY * 0.0015), 0.05, 40);
  const wx = (pt.x - SP.cam.x) / SP.cam.s, wy = (pt.y - SP.cam.y) / SP.cam.s;
  SP.cam = { s, x: pt.x - wx * s, y: pt.y - wy * s }; spDraw();
}, { passive: false });
new ResizeObserver(() => { if (SP.on) spDraw(); }).observe(spCv);

$('#spSteps').addEventListener('click', e => {
  const b = e.target.closest('[data-sp]'); if (!b) return;
  if (b.dataset.sp === 'add') {
    const n = prompt('切り出すパーツの名前', ''); if (!n) return;
    SP.steps.splice(SP.steps.length - 1, 0, { name: n, hint: '好きな範囲', fill: true, opt: true, done: false });
    spGoto(SP.steps.length - 2); return;
  }
  spGoto(+b.dataset.sp);
});
document.querySelectorAll('#split [data-tool]').forEach(b => b.onclick = () => spSetTool(b.dataset.tool));
$('#spSize').addEventListener('input', e => { if (SP.tool === 'wand') SP.tol = +e.target.value; else SP.size = +e.target.value; });
$('#spShowCut').onchange = spDraw;
$('#spUndo').onclick = () => {
  if (!SP.hist.length) return toast('戻せる操作がありません', 1200);
  SP.mask = SP.hist.pop(); SP.mctx.clearRect(0, 0, SP.W, SP.H); spMaskView(0, 0, SP.W - 1, SP.H - 1);
  if (SP.tool === 'ai') AI.points.pop();
  spDraw();
};
$('#spClear').onclick = () => { aiReset(); if (!SP.mask.some(v => v)) return; SP.hist.push(SP.mask.slice()); SP.mask.fill(0); SP.mctx.clearRect(0, 0, SP.W, SP.H); spDraw(); };
$('#spSkip').onclick = () => { SP.mask.fill(0); SP.mctx.clearRect(0, 0, SP.W, SP.H); spNext(); };
$('#spCut').onclick = spCut;
$('#spRemName').addEventListener('input', e => SP.remName = e.target.value);
$('#spDone').onclick = spFinish;
$('#spDone2').onclick = spFinish;
$('#spFit').onclick = () => { spFit(); spDraw(); };
$('#spCancel').onclick = () => { if (SP.cuts.length && !confirm('分けた内容を捨てて閉じますか？')) return; closeSplit(); };
document.querySelectorAll('#spAiBar [data-ais]').forEach(b => b.onclick = () => { AI.sign = +b.dataset.ais; for (const x of document.querySelectorAll('#spAiBar [data-ais]')) x.classList.toggle('on', x === b); });
$('#spAiSize').onclick = () => { if (!AI.mdata) return toast('先に絵をタップしてください', 1500); SP.hist.push(SP.mask.slice()); AI.pick = (AI.pick + 1) % AI.mdims[0]; aiApply(); };
$('#spAiReset').onclick = () => { if (AI.points.length) SP.hist.push(SP.mask.slice()); aiReset(); SP.mask.fill(0); SP.mctx.clearRect(0, 0, SP.W, SP.H); spDraw(); };
document.querySelectorAll('.tabs [data-tab]').forEach(b => b.onclick = () => showTab(b.dataset.tab));
$('#sheetClose').onclick = () => openSheet(false);
$('#sheetBtn').onclick = () => openSheet($('#sheet').classList.contains('hidden'));
$('#modeView').onclick = () => setMode('view');
$('#modeMove').onclick = () => setMode('move');
$('#modeDeform').onclick = () => { setMode('deform'); if (App.doc && !App.sel) toast('変形したいパーツをタップして選んでください'); };
$('#fitBtn').onclick = fit;
$('#menuBtn').onclick = e => { e.stopPropagation(); $('#menu').classList.toggle('hidden'); };
document.addEventListener('click', e => { if (!e.target.closest('#menu')) $('#menu').classList.add('hidden'); });
const ACTIONS = {
  open: () => $('#fileIn').click(),
  openMulti: () => $('#fileInMulti').click(),
  sample: openSample,
  saveProj: saveProject,
  exportPng: exportPNG,
  split: () => openSplit(),
  meshAll: () => {
    if (!App.doc) return toast('まだ何も開いていません');
    const deformed = App.parts.filter(hasAnyOffs).length;
    if (deformed && !confirm(`変形済みのパーツ${deformed}個もリセットして作り直しますか？\n（キャンセルすると変形していないパーツだけ作ります）`)) {
      for (const p of App.parts) if (!hasAnyOffs(p)) { p.mesh = autoMesh(p, p.div); evaluate(p); }
    } else for (const p of App.parts) { p.mesh = autoMesh(p, p.div); clearAllOffs(p); }
    App.showMesh = true; commit(); updateProps(); requestRender();
    toast(`${App.parts.length}パーツにメッシュを作りました`);
  },
  close: async () => {
    if (!App.doc || !confirm('作業を閉じますか？（自動保存も消えます）')) return;
    resetDoc(); await DB.del('project').catch(() => { });
    $('#empty').classList.remove('hidden'); $('#docName').textContent = 'ステップ4：揺れとモーション';
    renderList(); renderParams(); renderPhys(); renderMotion(); updateProps(); updateUndoBtns(); setMode(App.mode); openSheet(false); requestRender();
  },
};
document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => { $('#menu').classList.add('hidden'); ACTIONS[b.dataset.act](); }));
const onPick = async e => { const files = [...e.target.files]; e.target.value = ''; if (files.length) await openFiles(files); setMode(App.mode); };
$('#fileIn').onchange = onPick;
$('#fileInMulti').onchange = onPick;

initGL();
setMode('view');
restoreAutosave().then(() => setMode(App.mode));
</script>
</body>
